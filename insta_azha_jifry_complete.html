    .chat-header-username { font-size: 13px; color: var(--instagram-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-header-actions { display: flex; gap: 8px; }
    .chat-header-action-btn {
      width: 32px; height: 32px; border-radius: 50%; background: var(--instagram-light-blue); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--instagram-black);
    }
    .chat-header-action-btn:hover { background: #d0d2d6; }
    .messages-area {
      flex: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      scrollbar-width: thin; scrollbar-color: #ccc transparent;
    }
    .messages-area::-webkit-scrollbar { width: 6px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 20px; }
    .messages-area::-webkit-scrollbar-thumb:hover { background-color: #aaa; }
    .message {
      max-width: 80%; padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; word-wrap: break-word;
      animation: messageIn 0.3s ease-out;
    }
    @keyframes messageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.outgoing { align-self: flex-end; background: var(--instagram-blue); color: white; }
    .message.incoming { align-self: flex-start; background: var(--instagram-light-blue); color: var(--instagram-black); }
    .message-time {
      font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right;
    }
    .message.outgoing .message-time { color: rgba(255,255,255,0.7); }
    .message.incoming .message-time { color: var(--instagram-gray); }
    .attachment { width: 100%; aspect-ratio: 16/9; border-radius: 8px; margin-top: 8px; background-color: var(--instagram-light-blue); overflow: hidden; }
    .attachment img { width: 100%; height: 100%; object-fit: cover; }
    .input-area {
      padding: 12px 16px; border-top: 1px solid var(--instagram-divider); background-color: var(--instagram-white);
      display: flex; gap: 8px;
    }
    .input-area input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--instagram-divider); border-radius: 20px; font-size: 13px; outline: none;
    }
    .input-area button {
      padding: 0 16px; background: var(--instagram-blue); color: white; border: none; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;

    .section-divider { height: 1px; background: var(--instagram-divider); margin: 16px 0; }
    .section-title { font-size: 12px; color: var(--instagram-gray); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 16px; }
    .date-separator { padding: 8px 16px; font-size: 11px; color: var(--instagram-gray); background: var(--instagram-light-blue); margin: 8px 0; border-radius: 10px; }
